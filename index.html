    <meta charset="UTF-8" />

    <title>Birthday Surprise!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Comic Neue', cursive;
        margin: 0;
        overflow: hidden; /* Prevent scrolling during animations */
        background-color: #fdf2f8; /* pink-50 */
      }
      h1, h2, h3, button {
        font-family: 'Fredoka One', cursive;
      }
      .shake-screen {
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
      }
      @keyframes shake {
        10%, 90% { transform: translate3d(-4px, 0, 0); }
        20%, 80% { transform: translate3d(8px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-16px, 0, 0); }
        40%, 60% { transform: translate3d(16px, 0, 0); }
      }
      .cursor-knife {
        cursor: crosshair;
      }
    </style>
